        :root {
            --av-brand: #F62AED;
            --av-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --av-header-txt: #fff;
            --av-mine-bg: #39a3ff;
            --av-mine-txt: #fff;
        }

        .avasam-widget-bubble {
            position: fixed; bottom: 16px; right: 16px; z-index: 999999;
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--av-brand); border: none; cursor: pointer;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s;
        }
        .avasam-widget-bubble:hover { transform: scale(1.1); }
        .avasam-widget-bubble img { width: 22px; height: 22px; filter: brightness(0) invert(1); }

        .avasam-widget-panel {
            position: fixed; bottom: 76px; right: 16px; z-index: 999999;
            width: 360px; max-height: 520px; border-radius: 12px;
            background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; overflow: hidden;
            font-family: var(--av-font);
            font-size: 14px; color: #1a1a1a;
        }
        .avasam-widget-panel.hidden { display: none; }

        .avasam-widget-header {
            background: var(--av-brand); color: var(--av-header-txt); padding: 14px 16px;
            font-weight: 600; font-size: 15px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .avasam-widget-header button {
            background: none; border: none; color: var(--av-header-txt); font-size: 18px; cursor: pointer;
        }

        .avasam-widget-form {
            padding: 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .avasam-widget-form input {
            padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 13px; outline: none;
        }
        .avasam-widget-form input:focus { border-color: var(--av-brand); }
        .avasam-widget-form button {
            padding: 10px; background: var(--av-brand); color: var(--av-header-txt);
            border: none; border-radius: 6px; font-size: 14px; font-weight: 500;
            cursor: pointer;
        }
        .avasam-widget-form button:disabled { opacity: 0.6; cursor: not-allowed; }

        .avasam-widget-messages {
            flex: 1; overflow-y: auto; padding: 12px 16px;
            display: flex; flex-direction: column; gap: 8px;
            max-height: 340px; min-height: 200px;
        }

        .avasam-widget-msg {
            max-width: 80%; padding: 8px 12px; border-radius: 8px;
            font-size: 13px; line-height: 1.4; word-wrap: break-word;
        }
        .avasam-widget-msg.mine {
            align-self: flex-end; background: var(--av-mine-bg); color: var(--av-mine-txt);
        }
        .avasam-widget-msg.other {
            align-self: flex-start; background: #f1f1f1; color: #1a1a1a;
        }
        .avasam-widget-msg .msg-by {
            font-weight: 600; font-size: 11px; margin-bottom: 2px;
        }
        .avasam-widget-msg .msg-date {
            font-size: 10px; opacity: 0.7; margin-bottom: 4px;
        }
        .avasam-widget-msg .msg-attachments {
            margin-top: 4px; font-size: 11px;
        }
        .avasam-widget-msg .msg-attachments a {
            color: inherit; text-decoration: underline;
        }

        .avasam-widget-input {
            padding: 10px 16px; border-top: 1px solid #eee;
            display: flex; gap: 8px; align-items: center;
        }
        .avasam-widget-input textarea {
            flex: 1; padding: 8px 10px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 13px; resize: none;
            outline: none; font-family: inherit; max-height: 80px;
        }
        .avasam-widget-input textarea:focus { border-color: var(--av-brand); }
        .avasam-widget-input button {
            padding: 8px 14px; background: var(--av-brand); color: var(--av-header-txt);
            border: none; border-radius: 6px; font-size: 13px; cursor: pointer;
            white-space: nowrap;
        }
        .avasam-widget-input button:disabled { opacity: 0.6; cursor: not-allowed; }

        .avasam-widget-attach-btn {
            background: none; border: 1px solid #ddd; border-radius: 6px;
            padding: 6px 8px; cursor: pointer; font-size: 14px; line-height: 1;
            color: #888; transition: border-color 0.15s, color 0.15s;
        }
        .avasam-widget-attach-btn:hover { border-color: var(--av-brand); color: var(--av-brand); }

        .avasam-widget-pending-files {
